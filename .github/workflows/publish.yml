name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Check out the tag, not master, so the published artifact is exactly what was
      # released and a later push to master cannot change it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify tag matches the library version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          CURRENT=$(node -p "require('./src/library/package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "::error::Tag $TAG expects version $VERSION but src/library/package.json is $CURRENT."
            echo "Bump the version in a pull request before tagging the release."
            exit 1
          fi
          echo "Version $VERSION matches the tag."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - run: bun run build:lib

      # Trusted publishing via OIDC — no npm token is stored in this repo.
      - run: npm publish
        working-directory: dist/ngx-prompt-kit
        env:
          NODE_AUTH_TOKEN: ''
