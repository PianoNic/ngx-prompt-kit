name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Check out the tag, not master, so the published artifact is exactly what was
      # released and a later push to master cannot change it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # The release tag is the version. Release Drafter picks it from the PR labels, so
      # nobody bumps package.json by hand; it is stamped here for the build only.
      - name: Set library version from the release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$TAG' is not a semantic version"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Publishing $VERSION"
        working-directory: src/library

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - run: bun run build:lib

      # Trusted publishing via OIDC — no npm token is stored in this repo.
      - run: npm publish
        working-directory: dist/ngx-prompt-kit
        env:
          NODE_AUTH_TOKEN: ''
